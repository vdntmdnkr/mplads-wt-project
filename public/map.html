<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIS Map – MPLADS Project Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    /* Map Layout */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: calc(100vh - 64px);
      display: flex;
    }
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }
    /* Map Sidebar */
    .map-sidebar {
      width: 380px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid var(--border, #dce1e7);
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: -2px 0 10px rgba(0,0,0,0.06);
    }
    .map-sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border, #dce1e7);
      background: #f8fafc;
    }
    .map-sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    /* Project item in sidebar */
    .project-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .project-item:hover {
      border-color: var(--primary, #1a4b8c);
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }
    .project-item.active {
      border-color: var(--primary, #1a4b8c);
      background: #f0f7ff;
    }
    /* Floating Map Controls */
    .map-controls-floating {
      position: absolute;
      top: 16px;
      left: 60px;
      z-index: 500;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      backdrop-filter: blur(4px);
    }
    .map-btn {
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .map-btn:hover {
      border-color: var(--primary, #1a4b8c);
      color: var(--primary, #1a4b8c);
      background: #f8fafc;
    }
    .map-btn.active {
      background: var(--primary, #1a4b8c);
      color: #ffffff;
      border-color: var(--primary, #1a4b8c);
    }
    .map-btn.pune-highlight {
      background: #fffbeb;
      border-color: #f59e0b;
      color: #b45309;
      font-weight: 700;
    }
    .map-btn.pune-highlight:hover,
    .map-btn.pune-highlight.active {
      background: #f59e0b;
      color: #ffffff;
    }
    /* Floating Stats Bar */
    .map-stats-floating {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 500;
      background: rgba(26, 75, 140, 0.92);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      display: flex;
      gap: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      font-size: 0.85rem;
    }
    .stat-pill {
      display: flex;
      flex-direction: column;
    }
    .stat-pill .num {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .stat-pill .lbl {
      font-size: 0.72rem;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Custom Map Marker Styling */
    .custom-div-icon {
      background: transparent;
      border: none;
    }
    .pulse-pin {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .pulse-pin:hover {
      transform: scale(1.3);
    }
    .pin-completed { background: #16a34a; }
    .pin-ongoing   { background: #ea580c; }
    .pin-sanctioned{ background: #2563eb; }
    .pin-recommended{ background: #8b5cf6; }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .popup-content h4 {
      margin: 0 0 6px 0;
      font-size: 0.95rem;
      color: var(--primary, #1a4b8c);
      line-height: 1.35;
    }
    .popup-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .badge-comp { background: #dcfce7; color: #15803d; }
    .badge-ong  { background: #ffedd5; color: #c2410c; }
    .badge-sanc { background: #dbeafe; color: #1d4ed8; }
    .popup-table {
      width: 100%;
      font-size: 0.8rem;
      border-collapse: collapse;
      margin: 6px 0 10px;
    }
    .popup-table td {
      padding: 3px 0;
      border: none;
    }
    .popup-progress {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .popup-progress-fill {
      height: 100%;
      background: #16a34a;
    }

    @media (max-width: 900px) {
      .map-wrapper { flex-direction: column; }
      .map-sidebar { width: 100%; height: 260px; }
      .map-controls-floating { left: 16px; top: 12px; }
      .map-stats-floating { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────── -->
  <nav>
    <div class="nav-brand">
      MPLADS Monitor
      <span class="gov-badge">GOV</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="map.html" class="active">GIS Map</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="ai-analytics.html">AI Risk Monitor</a></li>
      <li><a href="track.html">Track Complaint</a></li>
      <li><a href="report.html" class="btn-report">Report Issue</a></li>
    </ul>
  </nav>

  <!-- ── Interactive Map Layout ──────────────────────────── -->
  <div class="map-wrapper">

    <!-- Floating Top Controls -->
    <div class="map-controls-floating">
      <!-- Quick Focus Buttons -->
      <button class="map-btn pune-highlight" onclick="focusPune()" title="Center on Pune District">
        <span>Focus on Pune</span>
      </button>
      <button class="map-btn" onclick="focusIndia()" title="View entire India">
        <span>All India</span>
      </button>

      <!-- Status Filters -->
      <button class="map-btn active" id="filter-all" onclick="filterByStatus('all')">All Works</button>
      <button class="map-btn" id="filter-completed" onclick="filterByStatus('Completed')">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#16a34a;"></span>
        Completed
      </button>
      <button class="map-btn" id="filter-ongoing" onclick="filterByStatus('Ongoing')">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ea580c;"></span>
        Ongoing
      </button>
      <button class="map-btn" id="filter-sanctioned" onclick="filterByStatus('Sanctioned')">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#2563eb;"></span>
        Sanctioned
      </button>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Floating Bottom Stats Bar -->
    <div class="map-stats-floating" id="map-stats">
      <div class="stat-pill">
        <span class="num" id="stat-pinned">0</span>
        <span class="lbl">Projects Mapped</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-comp-count">0</span>
        <span class="lbl">Completed</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-ong-count">0</span>
        <span class="lbl">Ongoing</span>
      </div>
      <div class="stat-pill">
        <span class="num" id="stat-pune-count">0</span>
        <span class="lbl">Pune District</span>
      </div>
    </div>

    <!-- Right Sidebar: Project Directory -->
    <div class="map-sidebar">
      <div class="map-sidebar-header">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h3 style="margin:0; font-size:1.05rem; color:var(--primary, #1a4b8c);">Mapped Projects</h3>
          <span id="sidebar-count" style="font-size:0.8rem; font-weight:700; color:#64748b;">Loading...</span>
        </div>
        <input type="text" id="map-search" placeholder="Search by title, MP, or Pune..." 
          style="width:100%; padding:8px 12px; font-size:0.85rem; border:1px solid #cbd5e1; border-radius:6px;"
          oninput="handleSearch(this.value)" />
      </div>

      <div class="map-sidebar-content" id="sidebar-projects-list">
        <div style="text-align:center; padding:30px; color:#64748b;">Loading map data...</div>
      </div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Authentication Handler -->
  <script src="js/auth.js"></script>
  <!-- Map Logic -->
  <script src="js/map.js"></script>
</body>
</html>
